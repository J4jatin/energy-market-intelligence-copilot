name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock jinja2 python-dotenv
    - name: Run tests
      run: pytest tests/ -v --tb=short
    - name: Check code structure
      run: |
        python -c "from src.chatbot.prompts import SYSTEM_PROMPT; print('prompts OK')"
        python -c "from src.newsletter.scraper import categorize_articles; print('scraper OK')"
