name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock ruff

    - name: Lint (ruff, advisory)
      run: ruff check . || true

    - name: Run unit tests
      run: pytest tests/ -v --tb=short

    - name: Import smoke test
      run: |
        python -c "from src.chatbot.rag_engine import MarketIntelligenceRAG; print('rag_engine OK')"
        python -c "from src.chatbot.agent import MarketIntelligenceAgent; print('agent OK')"
        python -c "from evals import evaluator; print('evaluator OK')"
