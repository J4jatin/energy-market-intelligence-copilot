trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  projectDir: '$(System.DefaultWorkingDirectory)'

stages:

# ──────────────────────────────────────────────
# STAGE 1: Lint & Test
# ──────────────────────────────────────────────
- stage: CI
  displayName: 'Lint & Test'
  jobs:
  - job: LintAndTest
    displayName: 'Run linting and unit tests'
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest-cov
      displayName: 'Install dependencies'

    - script: |
        flake8 src/ --max-line-length=100 --exclude=__pycache__
      displayName: '🔍 Lint with flake8'

    - script: |
        black --check src/
      displayName: '🎨 Format check with black'

    - script: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      displayName: '🧪 Run unit tests with coverage'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Market Intelligence Tests'

    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'


# ──────────────────────────────────────────────
# STAGE 2: Build Docker Image
# ──────────────────────────────────────────────
- stage: Build
  displayName: 'Build & Push Docker Image'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - job: DockerBuild
    displayName: 'Build Docker image'
    steps:

    - task: Docker@2
      displayName: 'Build and push to Azure Container Registry'
      inputs:
        command: buildAndPush
        repository: 'energy-market-intelligence-copilot'
        dockerfile: '$(projectDir)/Dockerfile'
        containerRegistry: 'AzureContainerRegistry'
        tags: |
          $(Build.BuildId)
          latest


# ──────────────────────────────────────────────
# STAGE 3: Deploy
# ──────────────────────────────────────────────
- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployApp
    displayName: 'Deploy Streamlit app'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "Deploying energy-market-intelligence-copilot"
              echo "Build ID: $(Build.BuildId)"
            displayName: 'Deploy to Azure Container Apps'


# ──────────────────────────────────────────────
# STAGE 4: Scheduled Pipeline Run
# ──────────────────────────────────────────────
- stage: ScheduledRun
  displayName: 'Run Market Intelligence Pipeline'
  dependsOn: []
  condition: eq(variables['Build.Reason'], 'Schedule')
  jobs:
  - job: RunPipeline
    displayName: 'Daily market intelligence run'
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install -r requirements.txt
        python src/automation/scheduler.py --run-now
      displayName: '⚡ Run market intelligence pipeline'
      env:
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        SHAREPOINT_SITE_URL: $(SHAREPOINT_SITE_URL)
        SHAREPOINT_CLIENT_ID: $(SHAREPOINT_CLIENT_ID)
        SHAREPOINT_CLIENT_SECRET: $(SHAREPOINT_CLIENT_SECRET)
        SHAREPOINT_TENANT_ID: $(SHAREPOINT_TENANT_ID)

    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: 'data/newsletters'
        artifactName: 'newsletters'
      displayName: '📤 Publish newsletter artifacts'

schedules:
- cron: '0 6 * * 1-5'   # Weekdays at 06:00 UTC
  displayName: 'Daily Market Intelligence Run'
  branches:
    include:
      - main
  always: true
